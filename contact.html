<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Hoofdmenu">
      <a class="logo" href="index.html">Zakaria<span>Portfolio</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">My Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact Me</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section container">
      <div class="page-heading">
        <span class="eyebrow">Contact</span>
        <h1>Contact Me</h1>
        <p class="intro-text">
          Wil je contact opnemen over een project, samenwerking of stage? Stuur gerust een bericht.
        </p>
      </div>

      <div class="contact-panel">
        <ul class="contact-list">
          <li>
            <strong>E-mail</strong>
            <a href="mailto:s1211189@student.windesheim.nl">s1211189@student.windesheim.nl</a>
          </li>
          <li>
            <strong>LinkedIn</strong>
            <a href="https://linkedin.com/in/Zakaria-Tamaditi" target="_blank" rel="noreferrer">Zakaria Tamaditi</a>
          </li>
        </ul>

        <form class="contact-form" action="#" method="post">
          <label for="name">Naam</label>
          <input type="text" id="name" name="name" placeholder="Jouw naam" required>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="jouw@email.com" required>

          <label for="message">Bericht</label>
          <textarea id="message" name="message" rows="5" placeholder="Schrijf hier je bericht..." required></textarea>

          <button type="submit">Verstuur bericht &rarr;</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Mijn Portfolio</p>
      <a href="contact.html">Contact opnemen</a>
    </div>
  </footer>
</body>
</html>
